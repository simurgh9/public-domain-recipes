locale = 'en-us'
title = 'Public Domain Recipes'
theme = ['sugo', 'lugo']

[params]
  favicon = "/favicon.svg"
  stylesheet = "/style.css"
  indexarticles = 50
  taglist = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
